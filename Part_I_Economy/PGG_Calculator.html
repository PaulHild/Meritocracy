{{ block title }}{{ endblock }}

{{ block content }}
<link rel="stylesheet" href="{{ static 'css/css.css' }}">

<div class="content-box box-info">
    <h2 class="section-title">Try it out: Token Transfer Calculator</h2>
    <hr class="section-divider">

    {{ include C.PGG_Calculator_body }}

    <!-- Hidden: interaction counter -->
    <div style="display:none">
        {{ formfield 'pgg_calc_interactions' }}
    </div>

    <div class="buttons-container">
        <button id="NextButton" class="btn btn-primary">Continue &rarr;</button>
    </div>
</div>

<script>
    // Increment the interaction counter each time the user hits Calculate
    var clicks = 0;
    window.onPggCalcRun_calc = function () {
        clicks++;
        var field = document.getElementById('id_pgg_calc_interactions');
        if (field) field.value = clicks;
    };
</script>

{{ endblock }}
